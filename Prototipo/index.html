<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Liga dos Guerreiros — Protótipo</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#0b0d17;color:#cfd3e6;font-family:monospace}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
canvas{width:min(960px,100vw,calc((100vh - 40px)*16/9));aspect-ratio:16/9;background:#000;outline:none;image-rendering:pixelated}
#help{font-size:12px;opacity:.75;text-align:center;padding:0 8px}
</style></head><body>
<canvas id="c" width="960" height="540" tabindex="0"></canvas>
<div id="help">Setas: mover · X: pular (2x) · ↓+X: descer · Z: atacar (combo) · C: esquiva · A/S/D: habilidades · P: pausar — clique no jogo se o teclado não responder</div>
<script>
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=480,H=270,GROUND=230,LEVEL_W=3150;
const keys={},pressed={};
const GK=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','KeyZ','KeyX','KeyC','KeyA','KeyS','KeyD','Enter','KeyP','KeyR','Escape'];
addEventListener('keydown',e=>{if(GK.includes(e.code))e.preventDefault();if(!keys[e.code])pressed[e.code]=true;keys[e.code]=true;});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
cv.addEventListener('click',()=>cv.focus());cv.focus();
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function srand(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646;};}

// ---------- CLASSES ----------
const CLASSES=[
{id:'guardiao',name:'Kael',cls:'Guardião',weapon:'Espada longa e escudo',role:'Corpo a corpo · Equilibrado',
 desc:['Linha de frente. Combos sólidos, investidas','e golpes que lançam inimigos ao ar.'],
 hp:240,mp:100,speed:1.7,body:'#2f5fbf',dark:'#1d3c7a',trim:'#e8c547',hair:'#6b3a1f',
 skills:[{n:'Investida de Escudo',mp:15,cd:180,c:'#e8c547'},{n:'Corte Giratório',mp:30,cd:300,c:'#9fd3ff'},{n:'Lâmina Ascendente',mp:20,cd:240,c:'#ffffff'}]},
{id:'cacadora',name:'Lyra',cls:'Caçadora',weapon:'Arco longo',role:'Distância · Mobilidade',
 desc:['Ataca de longe, salta para trás e cobre','a tela com chuva de flechas.'],
 hp:170,mp:120,speed:2.0,body:'#2e7d4f',dark:'#1f5c38',trim:'#c9a26b',hair:'#e0b04a',
 skills:[{n:'Rajada Tripla',mp:15,cd:150,c:'#c9a26b'},{n:'Salto Evasivo',mp:20,cd:240,c:'#ffd23f'},{n:'Chuva de Flechas',mp:40,cd:420,c:'#8fe388'}]},
{id:'arcanista',name:'Oren',cls:'Arcanista',weapon:'Cajado rúnico',role:'Magia · Dano em área',
 desc:['Frágil, mas devastador: orbes de fogo,','raios em cadeia e meteoros.'],
 hp:150,mp:170,speed:1.55,body:'#6a3fa0',dark:'#45286b',trim:'#59d0ff',hair:'#d9d9e6',
 skills:[{n:'Orbe Flamejante',mp:20,cd:150,c:'#ff8a3d'},{n:'Corrente de Raios',mp:35,cd:300,c:'#9ff0ff'},{n:'Meteoro',mp:55,cd:480,c:'#ff4d2e'}]},
];

// ---------- STATE ----------
let scene='title',sel=0,G=null,hitstop=0,shake=0,paused=false,titleT=0;
function newGame(ci){
 const def=CLASSES[ci];
 G={def,t:0,cam:{x:0},player:makePlayer(def),enemies:[],hitboxes:[],projs:[],parts:[],nums:[],fx:[],timers:[],pickups:[],
  combo:0,comboT:0,maxCombo:0,dmgTaken:0,kills:0,msg:'',msgT:0,bossStarted:false,bossDead:false,cleared:[false,false],endT:0,result:null};
 spawnLevel();showMsg('FASE 1 — Ruínas de Arvália',170);scene='game';
}
function makePlayer(def){return{def,x:60,y:GROUND-24,w:12,h:24,vx:0,vy:0,facing:1,onGround:false,hp:def.hp,mp:def.mp,state:'idle',stateT:0,step:0,queued:false,jumps:0,invuln:0,dropT:0,cds:[0,0,0],dashCd:0,skill:-1,dead:false,deadT:0,anim:0};}
function showMsg(m,t=120){G.msg=m;G.msgT=t;}

// ---------- LEVEL ----------
const PLATS=[{x:300,y:186,w:70},{x:640,y:182,w:80},{x:1250,y:184,w:90},{x:1380,y:142,w:70},{x:1600,y:180,w:100},{x:1820,y:150,w:80},{x:2090,y:182,w:90},{x:2170,y:138,w:70},{x:2400,y:176,w:60},{x:2620,y:176,w:60}];
const EDEF={lodo:{w:14,h:10,hp:45,dmg:8},saqueador:{w:12,h:22,hp:80,dmg:10},morcego:{w:12,h:8,hp:30,dmg:7,fly:1},atirador:{w:12,h:22,hp:60,dmg:8},boss:{w:36,h:46,hp:1100,dmg:14}};
function addEnemy(type,x,sec,py){const d=EDEF[type];const e={type,x,y:py!==undefined?py-d.h:(d.fly?GROUND-85:GROUND-d.h),w:d.w,h:d.h,vx:0,vy:0,hp:d.hp,maxhp:d.hp,dmg:d.dmg,fly:!!d.fly,dir:-1,state:'walk',t:Math.floor(rand(0,60)),hurtT:0,flashT:0,atkCd:60,onGround:false,active:false,sec,boss:type==='boss',still:py!==undefined,anim:rand(0,100)};G.enemies.push(e);return e;}
function spawnLevel(){
 [['lodo',380],['lodo',430],['saqueador',560],['lodo',730],['saqueador',850],['morcego',900],['saqueador',980]].forEach(a=>addEnemy(a[0],a[1],0));
 [['saqueador',1180],['atirador',1290,184],['morcego',1350],['lodo',1450],['lodo',1490],['atirador',1640,180],['saqueador',1720],['morcego',1780],['morcego',1840],['saqueador',1920],['lodo',2040],['saqueador',2100],['atirador',2195,138]].forEach(a=>addEnemy(a[0],a[1],1,a[2]));
}
const secCleared=i=>!G.enemies.some(e=>e.sec===i&&!e.boss);
function barriers(){const b=[];if(!secCleared(0))b.push(1100);if(!secCleared(1)||(G.bossStarted&&!G.bossDead))b.push(2300);if(!G.bossDead)b.push(2780);return b;}
function applyBarriers(e){for(const bx of barriers()){if(e.x+e.w/2<bx){if(e.x+e.w>bx){e.x=bx-e.w;if(e.vx>0)e.vx=0;}}else if(e.x<bx){e.x=bx;if(e.vx<0)e.vx=0;}}e.x=clamp(e.x,0,LEVEL_W-e.w);}

// ---------- PHYSICS ----------
function physics(e,grav=true){
 if(grav)e.vy=Math.min(e.vy+0.3,8);
 e.x+=e.vx;e.y+=e.vy;e.onGround=false;
 if(e.vy>=0){const feet=e.y+e.h,prev=feet-e.vy;
  if(feet>=GROUND){e.y=GROUND-e.h;e.vy=0;e.onGround=true;}
  else if(!e.dropT)for(const p of PLATS){if(e.x+e.w>p.x&&e.x<p.x+p.w&&prev<=p.y+0.5&&feet>=p.y){e.y=p.y-e.h;e.vy=0;e.onGround=true;break;}}}
 if(e.dropT)e.dropT--;
}

// ---------- COMBAT PRIMITIVES ----------
function hitbox(o){o.hit=new Set();o.t=0;G.hitboxes.push(o);if(o.place)o.place(o);return o;}
function proj(o){o.hit=new Set();o.t=0;o.grav=o.grav||0;G.projs.push(o);return o;}
function fx(life,draw){G.fx.push({t:0,life,draw});}
function front(p,ox,oy,w,h){return{x:p.facing>0?p.x+p.w+ox:p.x-ox-w,y:p.y+oy,w,h};}
function follow(ox,oy,w,h){return o=>{const p=G.player;Object.assign(o,front(p,ox,oy,w,h));};}
function sparks(x,y,c,n,sp=2.5){for(let i=0;i<n;i++){const a=rand(0,6.28),s=rand(0.5,sp);G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-0.5,life:rand(14,26),c,s:rand(1,2.5),g:0.1});}}
function dust(x,y,n=4){for(let i=0;i<n;i++)G.parts.push({x:x+rand(-4,4),y,vx:rand(-1,1),vy:rand(-1,-0.2),life:rand(12,22),c:'#b9a888',s:2,g:0});}
function num(x,y,v,c,big){G.nums.push({x,y,v,c,big,t:0});}
function hit(t,src,cx){
 const dir=src.dir||(t.x+t.w/2>=cx?1:-1);
 if(t===G.player){hurtPlayer(src.dmg,dir,src.kbx??2,src.kby??2);return;}
 damageEnemy(t,src.dmg,dir,src.kbx??1,src.kby??0,src.heavy);
}
function damageEnemy(e,dmg,dir,kbx,kby,heavy){
 const p=G.player,crit=Math.random()<0.1;
 dmg=Math.round(dmg*rand(0.9,1.1)*(crit?1.5:1));
 e.hp-=dmg;e.flashT=6;e.active=true;
 if(e.boss){e.vx+=dir*kbx*0.12;}
 else{e.vx=dir*kbx;if(kby){e.vy=-kby;e.onGround=false;}e.hurtT=heavy?30:16;e.state='walk';e.t=0;}
 num(e.x+e.w/2,e.y-4,dmg,crit?'#ffd23f':'#ffffff',crit);
 sparks(e.x+e.w/2-dir*4,e.y+e.h/2,crit?'#ffd23f':'#fff3c4',crit?10:6);
 hitstop=Math.max(hitstop,heavy?6:3);if(heavy||crit)shake=Math.max(shake,4);
 G.combo++;G.comboT=120;G.maxCombo=Math.max(G.maxCombo,G.combo);
 p.mp=Math.min(p.def.mp,p.mp+1.5);
 if(e.hp<=0)killEnemy(e);
}
function killEnemy(e){
 e.hp=0;G.kills++;const cx=e.x+e.w/2,cy=e.y+e.h/2;
 const col={lodo:'#6fd36b',saqueador:'#b5651d',morcego:'#7a5ca8',atirador:'#8a8f9c',boss:'#d9a066'}[e.type];
 sparks(cx,cy,col,e.boss?60:16,e.boss?5:3);sparks(cx,cy,'#fff',e.boss?30:6,3);
 if(e.boss){G.bossDead=true;shake=14;hitstop=20;showMsg('Colosso derrotado! Siga para o portal ➜',220);
  for(let i=0;i<6;i++)G.timers.push({t:i*8,fn:()=>sparks(cx+rand(-20,20),cy+rand(-20,20),'#ffb347',20,4)});}
 else if(Math.random()<0.3)G.pickups.push({x:cx-4,y:e.y,w:8,h:8,vy:-2,kind:Math.random()<0.55?'hp':'mp',t:0});
}
function hurtPlayer(dmg,dir,kbx=2,kby=2){
 const p=G.player;if(p.invuln>0||p.dead||G.result)return;
 p.hp-=dmg;G.dmgTaken+=dmg;num(p.x+p.w/2,p.y-4,dmg,'#ff5b5b',false);
 sparks(p.x+p.w/2,p.y+10,'#ff5b5b',8);shake=Math.max(shake,5);hitstop=Math.max(hitstop,4);G.combo=0;
 if(p.hp<=0){p.hp=0;p.dead=true;p.state='dead';p.vx=dir*2;p.vy=-3;return;}
 p.state='hurt';p.stateT=0;p.vx=dir*kbx;p.vy=-kby;p.invuln=60;p.skill=-1;
}

// ---------- PLAYER ATTACKS & SKILLS ----------
const ATK_DUR=[16,16,24],ATK_HIT=[5,5,8];
function arrow(p,dmg,o={}){const f=p.facing;proj(Object.assign({owner:'p',x:p.x+p.w/2+f*6-5,y:p.y+9,w:12,h:3,vx:6.5*f,vy:0,dmg,kbx:2,kby:0.5,life:70,kind:'arrow',dir:f},o));}
function attackHit(p){
 const f=p.facing,s=p.step,id=p.def.id,big=s===2;
 if(id==='guardiao'){if(p.onGround)p.vx=f*(big?2.5:1.5);
  hitbox(Object.assign({owner:'p',dmg:big?20:11,kbx:big?4.5:1.5,kby:big?3:0.5,life:5,heavy:big,dir:f},front(p,-2,big?-6:2,big?28:24,big?28:18)));
  const cx=p.x+p.w/2,cy=p.y+12;fx(9,k=>slashArc(cx,cy,f,big?22:18,s,k,'#ffffff'));}
 else if(id==='cacadora'){arrow(p,big?17:9,big?{pierce:1,w:16,kbx:4,kby:1.5,color:'#ffd23f'}:{});if(p.onGround)p.vx=-f*(big?1.5:0.5);}
 else{if(!big){hitbox(Object.assign({owner:'p',dmg:8,kbx:1.2,kby:0.3,life:5,dir:f},front(p,-2,2,20,16)));const cx=p.x+p.w/2,cy=p.y+12;fx(8,k=>slashArc(cx,cy,f,15,s,k,'#59d0ff'));}
  else proj({owner:'p',x:p.x+p.w/2+f*8-5,y:p.y+7,w:10,h:8,vx:4.5*f,vy:0,dmg:18,kbx:3,kby:1,life:80,kind:'bolt',dir:f});}
}
function slashArc(cx,cy,f,r,s,k,c){ctx.save();ctx.translate(cx,cy);ctx.scale(f,1);ctx.strokeStyle=c;ctx.globalAlpha=1-k;ctx.lineWidth=3*(1-k)+1;ctx.beginPath();
 if(s===1)ctx.arc(0,0,r,0.9,-1.2,true);else ctx.arc(0,0,r,-1.3,1.0);ctx.stroke();ctx.restore();}
function explode(x,y,w,h,dmg,kby,col){hitbox({owner:'p',x:x-w/2,y:y-h/2,w,h,dmg,kbx:3,kby,life:6,heavy:true});shake=Math.max(shake,6);
 sparks(x,y,col,26,4);sparks(x,y,'#fff6d0',10,3);fx(16,k=>{ctx.globalAlpha=1-k;ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,(w/2)*(0.4+k*0.8),0,6.28);ctx.fill();ctx.globalAlpha=1;});}
const SKILLS={
 guardiao:[
  {dur:18,start:p=>{p.invuln=Math.max(p.invuln,18);hitbox({owner:'p',dmg:22,kbx:5,kby:2,life:15,heavy:true,dir:p.facing,place:follow(-4,0,14,24)});},
   update:(p,t)=>{p.vx=t<14?5*p.facing:p.vx*0.6;if(t%2)G.parts.push({x:p.x+p.w/2,y:p.y+12,vx:0,vy:0,life:10,c:p.def.body,s:6,g:0,a:0.4});}},
  {dur:36,start:p=>hitbox({owner:'p',dmg:11,kbx:2,kby:1,life:36,rehit:9,dir:0,place:o=>{const q=G.player;o.x=q.x+q.w/2-30;o.y=q.y-4;o.w=60;o.h=30;}}),
   update:p=>{p.vx=((keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0))*0.9;}},
  {dur:26,start:p=>{p.vy=-5.5;p.vx=1.5*p.facing;hitbox({owner:'p',dmg:28,kbx:1.5,kby:6.5,life:12,heavy:true,dir:p.facing,place:follow(-4,-12,22,34)});}},
 ],
 cacadora:[
  {dur:20,update:(p,t)=>{if(t===6)[-0.9,0,0.9].forEach(vy=>arrow(p,13,{vy}));}},
  {dur:24,start:p=>{p.vx=-3.5*p.facing;p.vy=-4.5;p.invuln=Math.max(p.invuln,24);},update:(p,t)=>{if(t===8)arrow(p,30,{pierce:1,w:18,kbx:4,kby:2,color:'#ffd23f',heavyp:1});}},
  {dur:22,update:(p,t)=>{if(t===8){const f=p.facing,bx=p.x;for(let i=0;i<18;i++)G.timers.push({t:4+i*3,fn:()=>proj({owner:'p',x:bx+f*(30+rand(0,180)),y:-10,w:3,h:12,vx:0.6*f,vy:7.5,dmg:10,kbx:0.5,kby:1,life:60,kind:'rain',dir:f})});}}},
 ],
 arcanista:[
  {dur:22,update:(p,t)=>{if(t===8){const f=p.facing;proj({owner:'p',x:p.x+p.w/2+f*8-6,y:p.y+5,w:12,h:12,vx:3.2*f,vy:0,dmg:30,kbx:3,kby:2,life:120,kind:'fire',dir:f,onEnd:o=>explode(o.x+6,o.y+6,44,40,12,2,'#ff8a3d')});}}},
  {dur:28,update:(p,t)=>{if(t!==10)return;const cx=p.x+p.w/2,cy=p.y+8;
   const list=G.enemies.filter(e=>e.hp>0&&Math.hypot(e.x+e.w/2-cx,e.y+e.h/2-cy)<240).sort((a,b)=>Math.abs(a.x-cx)-Math.abs(b.x-cx)).slice(0,4);
   let px=cx+p.facing*8,py=cy-6;
   if(!list.length){const tx=px+p.facing*60;bolt(px,py,tx,py+20);}
   for(const e of list){const ex=e.x+e.w/2,ey=e.y+e.h/2;bolt(px,py,ex,ey);px=ex;py=ey;damageEnemy(e,32,ex>cx?1:-1,1,3,true);sparks(ex,ey,'#9ff0ff',10,3);}}},
  {dur:30,update:(p,t)=>{if(t!==10)return;const f=p.facing,sx=p.x-f*60,sy=-40,tx=p.x+f*130,N=40;
   proj({owner:'p',x:sx,y:sy,w:18,h:18,vx:(tx-sx)/N,vy:(GROUND-18-sy)/N,dmg:20,kbx:2,kby:3,life:200,pierce:1,kind:'meteor',dir:f,onEnd:o=>explode(o.x+9,GROUND-20,110,64,55,5,'#ff4d2e')});}},
 ],
};
function bolt(x1,y1,x2,y2){const pts=[];const n=8;for(let i=0;i<=n;i++){const k=i/n;pts.push([x1+(x2-x1)*k+(i&&i<n?rand(-6,6):0),y1+(y2-y1)*k+(i&&i<n?rand(-6,6):0)]);}
 fx(14,k=>{ctx.globalAlpha=1-k;ctx.strokeStyle='#e6fdff';ctx.lineWidth=2;ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke();ctx.strokeStyle='#59d0ff';ctx.lineWidth=4;ctx.globalAlpha=(1-k)*0.4;ctx.stroke();ctx.globalAlpha=1;});}
function startAttack(p,step){p.state='attack';p.stateT=0;p.step=step;p.queued=false;if(keys.ArrowLeft)p.facing=-1;if(keys.ArrowRight)p.facing=1;}
function trySkills(p){const ks=['KeyA','KeyS','KeyD'];for(let i=0;i<3;i++){if(!pressed[ks[i]])continue;const sk=p.def.skills[i];
 if(p.cds[i]>0||p.mp<sk.mp){p.denyT=20;continue;}
 if(keys.ArrowLeft)p.facing=-1;if(keys.ArrowRight)p.facing=1;
 p.state='skill';p.skill=i;p.stateT=0;p.mp-=sk.mp;p.cds[i]=sk.cd;const S=SKILLS[p.def.id][i];if(S.start)S.start(p);
 const x=p.x+p.w/2,y=p.y-14,name=sk.n,c=sk.c;fx(50,k=>{ctx.globalAlpha=k<0.8?1:(1-k)*5;text(name+'!',x,y-k*10,c,9,'center');ctx.globalAlpha=1;});
 return true;}return false;}
function setIdle(p){p.state='idle';p.stateT=0;p.skill=-1;}

function updatePlayer(){
 const p=G.player,d=p.def;p.anim++;
 p.mp=Math.min(d.mp,p.mp+0.1);for(let i=0;i<3;i++)if(p.cds[i]>0)p.cds[i]--;if(p.dashCd>0)p.dashCd--;if(p.invuln>0)p.invuln--;if(p.denyT>0)p.denyT--;
 if(p.dead){p.deadT++;p.vx*=0.92;physics(p);return;}
 if(G.result){p.vx*=0.8;physics(p);return;}
 p.stateT++;
 const L=keys.ArrowLeft,R=keys.ArrowRight;
 if(p.state==='hurt'){p.vx*=0.85;if(p.stateT>18)setIdle(p);}
 else if(p.state==='attack'){
  if(p.onGround)p.vx*=0.75;
  if(p.stateT===ATK_HIT[p.step])attackHit(p);
  if(pressed.KeyZ&&p.stateT>3)p.queued=true;
  if(p.stateT>ATK_HIT[p.step]&&trySkills(p)){}
  else if(p.stateT>=ATK_DUR[p.step]){if(p.queued&&p.step<2)startAttack(p,p.step+1);else setIdle(p);}
 }
 else if(p.state==='skill'){const S=SKILLS[d.id][p.skill];if(p.onGround&&!S.start)p.vx*=0.7;if(S.update)S.update(p,p.stateT);if(p.stateT>=S.dur)setIdle(p);}
 else if(p.state==='dash'){p.vx=4.6*p.facing;if(p.stateT%2)G.parts.push({x:p.x+p.w/2,y:p.y+12,vx:0,vy:0,life:10,c:d.body,s:7,g:0,a:0.35});if(p.stateT>12){setIdle(p);p.vx=1.5*p.facing;}}
 else{
  const tv=((R?1:0)-(L?1:0))*d.speed;p.vx+=(tv-p.vx)*0.3;if(L&&!R)p.facing=-1;if(R&&!L)p.facing=1;
  p.state=!p.onGround?'jump':Math.abs(tv)>0?'run':'idle';
  if(pressed.KeyX||pressed.Space||pressed.ArrowUp){
   if(keys.ArrowDown&&p.onGround&&p.y+p.h<GROUND-1){p.dropT=10;p.y+=1;}
   else if(p.onGround){p.vy=-6.2;p.jumps=1;dust(p.x+p.w/2,p.y+p.h);}
   else if(p.jumps<2){p.vy=-5.4;p.jumps=2;sparks(p.x+p.w/2,p.y+p.h,'#ffffff',5,1.5);}
  }
  if(pressed.KeyZ)startAttack(p,0);

 if(e.still&&e.type==='atirador'){}

function step(){
 if(scene==='title'){titleT++;
  if(pressed.ArrowLeft)sel=(sel+2)%3;if(pressed.ArrowRight)sel=(sel+1)%3;
  if(pressed.Enter||pressed.KeyZ)newGame(sel);return;}
 if(pressed.KeyP||pressed.Escape)paused=!paused;
 if(paused)return;
 const p=G.player;
 if(p.dead&&p.deadT>60){if(pressed.KeyR)newGame(CLASSES.indexOf(G.def));if(pressed.Enter){scene='title';}}
 if(G.result&&(pressed.Enter||pressed.KeyR)){if(pressed.KeyR)newGame(CLASSES.indexOf(G.def));else scene='title';return;}
 if(hitstop>0){hitstop--;return;}
 if(!G.result&&!p.dead)G.t++;
 updatePlayer();
 for(const e of G.enemies)if(e.hp>0)updateEnemy(e);
 // contact damage
 if(!p.dead)for(const e of G.enemies)if(e.hp>0&&e.hurtT<=0&&e.state!=='intro'&&overlap(e,p))hurtPlayer(e.boss&&e.state==='charge'?20:e.dmg,Math.sign(p.x-e.x)||1,2.5,2.5);
 // hitboxes
 for(const hb of G.hitboxes){if(hb.place)hb.place(hb);hb.t++;if(hb.rehit&&hb.t%hb.rehit===0)hb.hit.clear();
  const tg=hb.owner==='p'?G.enemies:[p];for(const t of tg){if(t.hp>0&&!hb.hit.has(t)&&overlap(hb,t)){hb.hit.add(t);hit(t,hb,hb.x+hb.w/2);}}}
 G.hitboxes=G.hitboxes.filter(h=>h.t<h.life);
 // projectiles
 for(const o of G.projs){o.t++;o.vy+=o.grav;o.x+=o.vx;o.y+=o.vy;
  const tg=o.owner==='p'?G.enemies:[p];
  for(const t of tg){if(o.dead)break;if(t.hp>0&&!o.hit.has(t)&&overlap(o,t)){o.hit.add(t);hit(t,o,o.x+o.w/2-o.vx);if(!o.pierce)o.dead=true;}}
  if(!o.noGround&&o.y+o.h>=GROUND)o.dead=true;
  if(o.t>o.life||o.x<-50||o.x>LEVEL_W+50)o.dead=true;
  if(o.kind==='fire'&&o.t%2)G.parts.push({x:o.x+6,y:o.y+6,vx:rand(-.3,.3),vy:rand(-.6,0),life:14,c:Math.random()<.5?'#ff8a3d':'#ffd23f',s:3,g:0});
  if(o.kind==='meteor')for(let i=0;i<2;i++)G.parts.push({x:o.x+9,y:o.y+9,vx:rand(-.5,.5),vy:rand(-.5,.5),life:20,c:Math.random()<.5?'#ff4d2e':'#ffb347',s:4,g:0});
  if(o.dead&&o.onEnd)o.onEnd(o);}
 G.projs=G.projs.filter(o=>!o.dead);
 G.enemies=G.enemies.filter(e=>e.hp>0);
 for(let i=0;i<2;i++)if(!G.cleared[i]&&secCleared(i)){G.cleared[i]=true;showMsg(i===0?'Área liberada! Avance ➜':'Caminho para a arena liberado ➜',150);}
 // timers, fx, particles
 for(const tm of G.timers)if(--tm.t<=0){tm.fn();tm.done=1;}G.timers=G.timers.filter(t=>!t.done);
 for(const k of G.pickups){k.t++;k.vy=Math.min(k.vy+0.2,4);k.y+=k.vy;if(k.y+k.h>GROUND){k.y=GROUND-k.h;k.vy=0;}}G.pickups=G.pickups.filter(k=>!k.dead&&k.t<900);
 for(const q of G.parts){q.x+=q.vx;q.y+=q.vy;q.vy+=q.g;q.life--;}G.parts=G.parts.filter(q=>q.life>0);
 for(const n of G.nums)n.t++;G.nums=G.nums.filter(n=>n.t<45);
 for(const f of G.fx)f.t++;G.fx=G.fx.filter(f=>f.t<f.life);
 if(G.comboT>0&&--G.comboT===0)G.combo=0;
 if(G.msgT>0)G.msgT--;
 // camera
 let target=p.x+p.w/2-W/2+p.facing*30,mn=0,mx=LEVEL_W-W;const cx=p.x+p.w/2;
 for(const b of barriers()){if(b<cx)mn=Math.max(mn,b-20);else mx=Math.min(mx,b+20-W);}
 if(G.bossStarted&&!G.bossDead){mn=2300;mx=2300;}
 G.cam.x+=(clamp(target,mn,Math.max(mn,mx))-G.cam.x)*0.12;
}
