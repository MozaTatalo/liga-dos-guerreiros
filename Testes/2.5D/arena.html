<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arena gótica do Kael</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Spectral:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: palco 3D em tela cheia, faixa de opções no topo, legenda no canto inferior esquerdo, vinheta por cima. */
  --noite: #0a0b12;
  --painel: rgba(10, 11, 18, 0.8);
  --linha: rgba(214, 208, 196, 0.2);
  --osso: #e4dfd2;
  --osso-fraco: #9d9a94;
  --carmesim: #a3243b;
  --fonte-titulo: "Cinzel", "Palatino Linotype", Georgia, serif;
  --fonte-corpo: "Spectral", Georgia, "Times New Roman", serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--noite); color: var(--osso); font-family: var(--fonte-corpo); overflow: hidden; }
#palco { position: relative; width: 100%; height: 100%; outline: none; }
#palco canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.vinheta { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 55%, rgba(0,0,0,0) 45%, rgba(4,4,10,0.72) 100%); }

.topo { position: absolute; top: 12px; left: 16px; right: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.topo button {
  font: 600 13px/1 var(--fonte-titulo); letter-spacing: 0.05em; color: var(--osso);
  background: var(--painel); border: 1px solid var(--linha); border-radius: 2px;
  padding: 10px 13px; cursor: pointer; display: flex; gap: 8px; align-items: center;
}
.topo button kbd { font: 800 11px/1 var(--fonte-titulo); color: var(--noite); background: var(--osso-fraco); border-radius: 2px; padding: 3px 5px; }
.topo button:hover { border-color: var(--osso-fraco); }
.topo button:focus-visible { outline: 2px solid var(--osso); outline-offset: 2px; }
.topo button[aria-pressed="true"] { background: var(--carmesim); border-color: var(--carmesim); }
.topo button[aria-pressed="true"] kbd { background: var(--noite); color: var(--osso); }
.topo .espaco { flex: 1; }

.fase { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 2px; text-shadow: 0 2px 6px #000; pointer-events: none; }
.fase span { font: 600 12px/1 var(--fonte-titulo); letter-spacing: 0.22em; text-transform: uppercase; color: var(--osso-fraco); }
.fase b { font: 800 30px/1 var(--fonte-titulo); letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }
.hud { position: absolute; left: 16px; bottom: 16px; display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; pointer-events: none; }
.brasao { width: 64px; height: 64px; transform: rotate(45deg); margin: 10px 14px 10px 10px; background: linear-gradient(135deg, #2a2d3c, #0d0e16); border: 2px solid var(--osso-fraco); box-shadow: 0 0 0 3px var(--noite), 0 0 18px rgba(163,36,59,0.7); display: grid; place-items: center; }
.brasao span { transform: rotate(-45deg); font: 800 30px/1 var(--fonte-titulo); color: var(--osso); text-shadow: 0 0 10px var(--carmesim); }
.barras { display: flex; flex-direction: column; gap: 5px; width: min(300px, 60vw); }
.nome { font: 800 17px/1 var(--fonte-titulo); letter-spacing: 0.06em; text-shadow: 0 2px 4px #000; }
.nome small { font: 600 11px/1 var(--fonte-titulo); letter-spacing: 0.18em; text-transform: uppercase; color: var(--osso-fraco); margin-left: 6px; }
.barra { position: relative; height: 18px; background: rgba(6,6,12,0.85); border: 1px solid var(--linha); transform: skewX(-18deg); overflow: hidden; }
.barra.mana { height: 13px; width: 82%; }
.barra i { position: absolute; inset: 0; transform-origin: left; transition: transform 0.15s; }
.barra.vida i { background: linear-gradient(#d2415c, #7d1628); }
.barra.mana i { background: linear-gradient(#7fc4ff, #2c4f9a); }
.barra em { position: absolute; right: 8px; top: 50%; transform: translateY(-50%) skewX(18deg); font: 600 11px/1 var(--fonte-corpo); font-style: normal; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px #000; }
.barra.mana em { font-size: 10px; }
.tecnicas { display: flex; gap: 8px; }
.tec { position: relative; width: 62px; height: 62px; background: var(--painel); border: 1px solid var(--osso-fraco); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; overflow: hidden; }
.tec kbd { font: 800 18px/1 var(--fonte-titulo); color: var(--osso); position: relative; }
.tec span { font: 600 9.5px/1 var(--fonte-titulo); letter-spacing: 0.06em; text-transform: uppercase; position: relative; }
.tec small { font-size: 9.5px; color: #8fc8ff; position: relative; }
.tec i { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(163,36,59,0.75); }
.tec.sem-mp { opacity: 0.45; }
.dica { position: absolute; right: 16px; bottom: 14px; margin: 0; font-size: 12.5px; color: var(--osso-fraco); text-shadow: 0 1px 3px #000; text-align: right; max-width: min(420px, 45vw); }
.dica b { color: var(--osso); font-weight: 600; }
.legenda { display: none; position: absolute; left: 16px; bottom: 16px; width: min(430px, calc(100% - 32px)); background: var(--painel); border: 1px solid var(--linha); border-left: 3px solid var(--carmesim); border-radius: 2px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.legenda h1 { font: 800 19px/1.2 var(--fonte-titulo); letter-spacing: 0.04em; margin: 0; text-wrap: balance; }
.legenda p { font-size: 14.5px; line-height: 1.5; margin: 0; }
.legenda .teclas { color: var(--osso-fraco); font-size: 13px; border-top: 1px solid var(--linha); padding-top: 8px; }
.legenda .teclas b { color: var(--osso); font-weight: 600; }

#combo { position: absolute; right: 22px; top: 120px; font: 800 36px/1 var(--fonte-titulo); color: var(--osso); text-shadow: 0 0 14px var(--carmesim), 0 2px 0 var(--noite); opacity: 0; transition: opacity 0.2s; font-variant-numeric: tabular-nums; text-align: right; }
#combo small { display: block; font-size: 12px; letter-spacing: 0.2em; color: var(--osso-fraco); }

.toque { position: absolute; right: 16px; bottom: 16px; display: none; gap: 10px; }
.toque button { width: 58px; height: 58px; border-radius: 50%; border: 1px solid var(--linha); background: var(--painel); color: var(--osso); font: 600 12px var(--fonte-titulo); touch-action: none; user-select: none; }
@media (pointer: coarse) { .toque { display: flex; bottom: 110px; } .dica { display: none; } }
@media (max-width: 760px) { .dica { display: none; } .topo button { padding: 9px 9px; font-size: 12px; } .fase { top: 110px; } }
</style>
</head>
<body>
<div id="palco" tabindex="0">
  <canvas id="cv"></canvas>
  <div class="vinheta"></div>

  <div class="topo">
    <button type="button" data-paleta="0" aria-pressed="true"><kbd>1</kbd>Aço negro e carmesim</button>
    <button type="button" data-paleta="1" aria-pressed="false"><kbd>2</kbd>Prata e azul-noite</button>
    <button type="button" data-paleta="2" aria-pressed="false"><kbd>3</kbd>Bronze e osso</button>
    <span class="espaco"></span>
    <button type="button" id="bt-zoom" aria-pressed="false"><kbd>V</kbd>Aproximar</button>
    <button type="button" id="bt-cam" aria-pressed="false"><kbd>C</kbd>Girar câmera</button>
  </div>

  <div id="combo">0<small>GOLPES</small></div>

  <div class="fase"><span>Fase 1 · Ruínas de Arvália</span><b id="relogio">00:00</b></div>

  <div class="hud">
    <div class="brasao" aria-hidden="true"><span>K</span></div>
    <div class="barras">
      <div class="nome">Kael <small>Guardião</small></div>
      <div class="barra vida"><i id="hp-fill"></i><em id="hp-num">1200 / 1200</em></div>
      <div class="barra mana"><i id="mp-fill"></i><em id="mp-num">60 / 100</em></div>
    </div>
    <div class="tecnicas">
      <div class="tec"><kbd>Z</kbd><span>Combo</span></div>
      <div class="tec" id="tec-a"><i id="cd-fill"></i><kbd>A</kbd><span>Investida</span><small>25 MP</small></div>
    </div>
  </div>

  <p class="dica"><b>Setas</b> andar · <b>Espaço ou X</b> pular (2x) · <b>↓ + pulo</b> descer · <b>Z</b> combo · <b>A</b> investida · <b>E</b> base ou equipado</p>

  <div class="toque">
    <button type="button" data-tecla="left">◀</button>
    <button type="button" data-tecla="right">▶</button>
    <button type="button" data-tecla="jump">Pulo</button>
    <button type="button" data-tecla="atk">Golpe</button>
    <button type="button" data-tecla="skill">Invest.</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* Kael, o Guardião: modelo 3D montado em código (three.js r128).
   Uso: var Kael = KaelLib(THREE); var k = Kael.criar(); scene.add(k.raiz); Kael.paleta(k, 0); Kael.posar(k, dt); */
function KaelLib(T) {
  'use strict';

  var NK = 0.56, TS = 0.72, TW = 0.76, QY = 0.6, H = 0.225, LU = 0.17, LF = 0.17, L1 = 0.2, L2 = 0.2, CAPA_L = 0.82;

  }

  var PALETAS = [
    { nome: 'Aço negro e carmesim', aco: '#343846', friso: '#99a1ba', pano: '#191822', capa: '#84172b', cabelo: '#e2dfea', mecha: '#b02a44', couro: '#2e1f1c', lamina: '#8f98b2', brilho: '#9ecbff', olho: '#c2243f', olhoClaro: '#ff9a86', pena: '#27304f', macacao: '#3a425c', pele: '#f2ddd0' },
    { nome: 'Prata e azul-noite', aco: '#8f98ae', friso: '#b59c5e', pano: '#171e35', capa: '#1e2f61', cabelo: '#1b1924', mecha: '#5f86dc', couro: '#241d24', lamina: '#aab3c8', brilho: '#c4e2ff', olho: '#3a78d6', olhoClaro: '#a6e4ff', pena: '#0d142b', macacao: '#2b3b6a', pele: '#f2ddd0' },
    { nome: 'Bronze e osso', aco: '#4d4036', friso: '#b8944e', pano: '#261f1d', capa: '#c0b7a2', cabelo: '#4a1a20', mecha: '#c9a255', couro: '#2c1e15', lamina: '#a59c88', brilho: '#ffc47a', olho: '#cf962a', olhoClaro: '#ffe592', pena: '#1e1714', macacao: '#6b5745', pele: '#efd6c4' }

  }
  function contorno(esp) {

    m.onBeforeCompile = function (s) {

  }
  var C_GROSSO = contorno(0.014), C_FINO = contorno(0.007), C_MEDIO = contorno(0.0095), C_CABECA = contorno(0.05), C_MECHA = contorno(0.035);

  var texBrilho = (function () {
    var c = document.createElement('canvas'); c.width = c.height = 128; var g = c.getContext('2d');
    var gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, 'rgba(255,255,255,0.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');

    var s = new T.Sprite(new T.SpriteMaterial({ map: texBrilho, transparent: true, opacity: opac, depthWrite: false, fog: false, blending: T.AdditiveBlending }));

  // ---------- Desenhos em canvas ----------
  function rosacea(g, cx, cy, r, traco, larg) { // emblema do Guardião: rosácea de oito pontas
    g.save(); g.translate(cx, cy); g.strokeStyle = traco; g.fillStyle = traco; g.lineWidth = larg; g.lineJoin = 'round';
    g.beginPath(); g.arc(0, 0, r, 0, PI * 2); g.stroke();
    g.beginPath(); g.arc(0, 0, r * 0.72, 0, PI * 2); g.lineWidth = larg * 0.6; g.stroke();
    for (var i = 0; i < 8; i++) {
      g.rotate(PI / 4);

  function olho(g, cx, cy, s, pal, fechado) {
    g.save(); g.translate(cx, cy); g.scale(s * 1.62, 1.55);
    if (fechado) {
      g.strokeStyle = '#1c1420'; g.lineWidth = 9; g.lineCap = 'round';
      g.beginPath(); g.moveTo(-54, 2); g.quadraticCurveTo(0, 22, 64, -8); g.stroke();
      g.lineWidth = 4; g.beginPath(); g.moveTo(60, -6); g.lineTo(76, -16); g.stroke();

    }
    function forma() { g.beginPath(); g.moveTo(-54, 8); g.bezierCurveTo(-24, -34, 26, -38, 60, -14); g.bezierCurveTo(44, 22, -8, 30, -54, 8); g.closePath(); }

    g.fillStyle = tom(pal.olho, 0.42); g.beginPath(); g.ellipse(ix, iy, rx, ry, 0, 0, PI * 2); g.fill();
    var gr = g.createRadialGradient(ix, iy + 16, 2, ix, iy + 6, 34);
    gr.addColorStop(0, pal.olhoClaro); gr.addColorStop(0.45, pal.olho); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.beginPath(); g.ellipse(ix, iy, rx - 3, ry - 3, 0, 0, PI * 2); g.fill();
    g.strokeStyle = tom(pal.olho, 0.22); g.lineWidth = 5; g.beginPath(); g.ellipse(ix, iy, rx, ry, 0, 0, PI * 2); g.stroke();
    g.strokeStyle = tom(pal.olhoClaro, 1.3); g.globalAlpha = 0.55; g.lineWidth = 2; g.beginPath(); g.ellipse(ix, iy + 3, 19, 22, 0, 0.1 * PI, 0.9 * PI); g.stroke(); g.globalAlpha = 1;
    // pupila em losango, a marca do Kael
    g.fillStyle = '#16060c'; g.beginPath(); g.moveTo(ix, iy - 17); g.lineTo(ix + 10, iy); g.lineTo(ix, iy + 17); g.lineTo(ix - 10, iy); g.closePath(); g.fill();
    // sombra da pálpebra e reflexos
    var so = g.createLinearGradient(0, -40, 0, -2); so.addColorStop(0, 'rgba(30,20,55,0.75)'); so.addColorStop(1, 'rgba(30,20,55,0)');
    g.fillStyle = so; g.fillRect(-60, -42, 130, 42);
    g.fillStyle = '#ffffff'; g.beginPath(); g.ellipse(ix - 11, iy - 15, 9, 6.5, -0.5, 0, PI * 2); g.fill();
    g.beginPath(); g.arc(ix + 13, iy + 15, 4, 0, PI * 2); g.fill();
    g.restore();
    // cílios
    g.fillStyle = '#1a121e';
    g.beginPath(); g.moveTo(-58, 9); g.bezierCurveTo(-26, -42, 28, -47, 66, -21); g.lineTo(82, -33); g.lineTo(64, -9);
    g.bezierCurveTo(30, -31, -20, -27, -50, 12); g.closePath(); g.fill();
    g.strokeStyle = 'rgba(40,24,36,0.85)'; g.lineWidth = 3.5; g.lineCap = 'round';
    g.beginPath(); g.moveTo(56, -8); g.bezierCurveTo(44, 22, 18, 30, -6, 29); g.stroke();
    g.strokeStyle = 'rgba(150,96,108,0.55)'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(-40, -36); g.bezierCurveTo(-10, -56, 34, -56, 60, -38); g.stroke();

  }
  function pintarRosto(g, w, h, pal, fechado) {
    var cx = w / 2, pele = pal.pele;
    g.fillStyle = pele; g.fillRect(0, 0, w, h);

    var gr = g.createLinearGradient(0, 740, 0, 860); gr.addColorStop(0, 'rgba(170,110,110,0)'); gr.addColorStop(1, 'rgba(170,110,110,0.35)');

      g.fillStyle = ol; g.fillRect(cx + s * 142 - 115, 365, 230, 230);
    });

    g.lineCap = 'round';
    g.strokeStyle = 'rgba(186,104,112,0.9)'; g.lineWidth = 6; g.beginPath(); g.moveTo(cx - 98, 380); g.quadraticCurveTo(cx - 130, 500, cx - 176, 610); g.stroke();
    g.strokeStyle = 'rgba(250,214,206,0.9)'; g.lineWidth = 2; g.beginPath(); g.moveTo(cx - 98, 383); g.quadraticCurveTo(cx - 130, 500, cx - 175, 606); g.stroke();

    g.fillStyle = 'rgba(160,98,102,0.55)'; g.beginPath(); g.moveTo(cx + 3, 572); g.lineTo(cx + 15, 606); g.lineTo(cx - 3, 609); g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.5)'; g.beginPath(); g.ellipse(cx - 5, 590, 4, 9, 0, 0, PI * 2); g.fill();
    g.strokeStyle = '#7e4148'; g.lineWidth = 5; g.beginPath(); g.moveTo(cx - 36, 686); g.quadraticCurveTo(cx, 678, cx + 36, 686); g.stroke();
    g.strokeStyle = 'rgba(160,98,102,0.5)'; g.lineWidth = 4; g.beginPath(); g.moveTo(cx - 14, 701); g.lineTo(cx + 14, 701); g.stroke();

    g.fillStyle = tom(pal.cabelo, parseInt(pal.cabelo.slice(1, 3), 16) > 128 ? 0.6 : 1.5);
    [-1, 1].forEach(function (s) {
      g.save(); g.translate(cx + s * 140, 492); g.scale(s * 1.4, 1.4);
      g.beginPath(); g.moveTo(-62, -50); g.lineTo(-54, -64); g.quadraticCurveTo(10, -80, 68, -76); g.quadraticCurveTo(10, -66, -62, -50); g.closePath(); g.fill();
      g.restore();
    });
  }
  function pintarPlaca(g, w, h, pal) { // membros: placa com frisos, nervura e rebites
    var gr = g.createLinearGradient(0, 0, w, 0);
    gr.addColorStop(0, tom(pal.aco, 0.7)); gr.addColorStop(0.25, tom(pal.aco, 1.25)); gr.addColorStop(0.5, tom(pal.aco, 0.8)); gr.addColorStop(0.75, tom(pal.aco, 0.6)); gr.addColorStop(1, tom(pal.aco, 0.7));
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.fillStyle = tom(pal.aco, 1.5); g.fillRect(w * 0.25 - 1.5, 0, 3, h);
    g.strokeStyle = tom(pal.aco, 0.4); g.lineWidth = 3;
    for (var k = 1; k < 3; k++) { g.beginPath(); for (var x = 0; x <= w; x += 4) { var y = h * k / 3 + Math.abs(((x / w + 0.75) % 1) - 0.5) * -60 + 15; if (x) g.lineTo(x, y); else g.moveTo(x, y); } g.stroke(); }

        pegou = true; g.hp -= forte ? 2 : 1; g.flash = 0.1; g.amasso = 1;
        g.vx = h.lado * (forte ? 8 : 3.5); if (forte) g.vy = 6;
        soltarFaiscas(g.x - h.lado * 0.3, g.y + 1.2, forte);
        if (g.hp <= 0) { g.morto = 0.001; g.vy = 5; g.vx = h.lado * 5; }
      }
    });
    if (pegou) {
      pausaImpacto = forte ? 0.12 : 0.065; tremor = poucoMovimento ? 0 : (forte ? 0.22 : 0.09);
      combo++; comboT = 2.2; h.mp = Math.min(100, h.mp + 7); elCombo.firstChild.nodeValue = combo; elCombo.style.opacity = 1;
    }
  }
  function atualizarEspectro(g, dt) {
    g.fase += dt; if (g.flash > 0) g.flash -= dt;
    g.amasso = Math.max(0, g.amasso - dt * 5);
    g.vy -= GRAV * dt; var yAntes = g.y;
    g.x += g.vx * dt; g.y += g.vy * dt; g.vx *= Math.pow(0.004, dt);
    if (g.vy <= 0) { var c = chaoEm(g.x, yAntes, g.y); if (g.y <= c) { g.y = c; g.vy = 0; } }
    if (!g.morto && Math.abs(heroi.x - g.x) > 0.3) g.lado = heroi.x > g.x ? 1 : -1;
    if (g.morto) { g.morto += dt; if (g.morto > 2.8) { g.morto = 0; g.hp = 6; g.x = g.x0; g.y = g.y0; g.vx = g.vy = 0; } }
  }

  // ---------- Poses ----------
  function suave(k) { k = Math.max(0, Math.min(1, k)); return 1 - Math.pow(1 - k, 3); }
  function posarHeroi(dt) { Kael.posar(heroi, dt); }
  function posarEspectro(g) {
    var P = g.p, w = Math.sin(g.fase * 2.2), am = g.amasso;
    var alvo = g.lado > 0 ? 0 : PI; g.raiz.rotation.y += (alvo - g.raiz.rotation.y) * 0.15;
    P.corpo.position.y = 0.3 + w * 0.08;
    P.corpo.scale.set(1 + am * 0.2, 1 - am * 0.22, 1 + am * 0.2);
    P.corpo.rotation.z = g.morto ? g.morto * 1.5 : -Math.abs(g.vx) * 0.05 + w * 0.03;
    P.bracoA.rotation.z = 1.0 + w * 0.15; P.bracoB.rotation.z = 0.8 - w * 0.15;
    var s = g.morto ? Math.max(0.001, 1 - g.morto * 1.5) : 1;
    g.raiz.scale.set(s, g.morto > 0.66 ? 0.001 : s, s);
    g.mats.forEach(function (m) { m.emissive.setHex(g.flash > 0 ? 0xffffff : 0x000000); });
    g.halo.material.opacity = 0.2 + w * 0.06;
    g.barra.visible = !g.morto && g.hp < 6; g.barra.position.set(g.x, g.y + 2.45, 0.2); g.barraFill.scale.x = Math.max(0.001, g.hp / 6);
  }

  // ---------- Laço ----------
  var hudSeg = -1, hudMp = -1, elRelogio = document.getElementById('relogio'), elMp = document.getElementById('mp-fill'), elMpNum = document.getElementById('mp-num'), elCd = document.getElementById('cd-fill'), elTec = document.getElementById('tec-a');
  var antes = performance.now(), tempo = 0, camX = heroi.x, camY = 2.4;
  function ajustarTamanho() {
    var w = palco.clientWidth || 800, h = palco.clientHeight || 450;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2)); renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.fov = w / h < 1.2 ? 40 : 28; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', ajustarTamanho); ajustarTamanho(); aplicarPaleta(0);

  function quadro(agora) {
    requestAnimationFrame(quadro);
    var dt = Math.min(0.033, (agora - antes) / 1000); antes = agora; tempo += dt;
    var parado = pausaImpacto > 0;
    if (parado) pausaImpacto -= dt; else { atualizarHeroi(dt); espectros.forEach(function (g) { atualizarEspectro(g, dt); }); }
    apertou.jump = apertou.atk = apertou.skill = false;
    if (comboT > 0) { comboT -= dt; if (comboT <= 0) { combo = 0; elCombo.style.opacity = 0; } }

    for (var i = faiscas.length - 1; i >= 0; i--) {
      var f = faiscas[i]; f.t -= dt;
      f.m.position.x += f.vx * dt; f.m.position.y += f.vy * dt;
      f.m.material.opacity = Math.max(0, f.t / (f.clarao ? 0.12 : 0.26));
      if (f.t <= 0) { scene.remove(f.m); f.m.material.dispose(); faiscas.splice(i, 1); }
    }
    chamas.forEach(function (c) {
      var k = 0.85 + Math.sin(tempo * 11 + c.fase) * 0.08 + Math.sin(tempo * 23 + c.fase * 2) * 0.07;
      if (c.luz) { c.luz.intensity = 1.5 * k; c.f1.scale.set(1.3 * k, 1.6 * k, 1); c.f2.scale.set(0.5 * k, 0.7 * k, 1); }
      else c.f2.scale.set(c.base * k, c.base * 1.4 * k, 1);
    });
    nevoas.forEach(function (n) { n.s.position.x += n.v * dt; if (n.s.position.x > camX + 34) n.s.position.x = camX - 34; if (n.s.position.x < camX - 36) n.s.position.x = camX + 30; });
    var pc = cinzas.geometry.attributes.position;
    for (var q = 0; q < pc.count; q++) {
      var y = pc.getY(q) + dt * (0.5 + (q % 5) * 0.12), x = pc.getX(q) + Math.sin(tempo + q) * dt * 0.3;
      if (y > 8) y = 0; if (x < camX - 15) x += 30; if (x > camX + 15) x -= 30;
      pc.setXY(q, x, y);
    }
    pc.needsUpdate = true;

    var alvoGiro = heroi.lado > 0 ? -0.42 : -PI + 0.42;
    heroi.giro += (alvoGiro - heroi.giro) * Math.min(1, dt * 18);
    heroi.raiz.rotation.y = heroi.giro; heroi.raiz.position.set(heroi.x, heroi.y, 0);
    espectros.forEach(function (g) { g.raiz.position.set(g.x, g.y, 0); });
    if (!parado) { posarHeroi(dt); espectros.forEach(posarEspectro); }

    zoomK += ((zoom ? 1 : 0) - zoomK) * Math.min(1, dt * 5);
    var alvoX = Math.max(5, Math.min(NIVEL_MAX - 5, heroi.x + heroi.lado * 1.2)) * (1 - zoomK) + (heroi.x + heroi.lado * 0.3) * zoomK;
    camX += (alvoX - camX) * Math.min(1, dt * 4);
    var alvoY = (2.9 + heroi.y * 0.62) * (1 - zoomK) + (heroi.y + 0.85) * zoomK;
    camY += (alvoY - camY) * Math.min(1, dt * 4);
    camAngulo += ((camGirada ? 0.75 : 0) - camAngulo) * Math.min(1, dt * 4);
    var dist = 14.5 - zoomK * 9, tx = 0, ty = 0;
    if (tremor > 0) { tremor -= dt; tx = (Math.random() - 0.5) * tremor; ty = (Math.random() - 0.5) * tremor; }
    camera.position.set(camX + Math.sin(camAngulo) * dist + tx, camY + 1.5 * (1 - zoomK) + 0.3 * zoomK + camAngulo * 2 + ty, Math.cos(camAngulo) * dist);
    camera.lookAt(camX + tx, camY + ty, 0);
    lua.position.set(camX - 9, 15, -9); lua.target.position.set(camX, 0, 0);
    frente.position.set(camX + 5, 7, 12); frente.target.position.set(camX, 1, 0);
    grupoLua.position.set(camX * 0.93 + 13, 32, -110);
    cascatas.forEach(function (tx) { tx.offset.y += dt * 0.16; });
    var seg = Math.floor(tempo);
    if (seg !== hudSeg) { hudSeg = seg; elRelogio.textContent = ('0' + Math.floor(seg / 60)).slice(-2) + ':' + ('0' + seg % 60).slice(-2); }
    var mpi = Math.round(heroi.mp);
    if (mpi !== hudMp) { hudMp = mpi; elMp.style.transform = 'scaleX(' + (mpi / 100) + ')'; elMpNum.textContent = mpi + ' / 100'; }
    elCd.style.height = (heroi.cd / 3 * 100) + '%'; elTec.classList.toggle('sem-mp', heroi.mp < 25);
    renderer.render(scene, camera);
  }
  requestAnimationFrame(quadro);
  palco.focus();
})();
</script>
